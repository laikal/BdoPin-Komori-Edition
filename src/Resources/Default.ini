; UTF-8. CPU numbers are group-local logical indices, valid only for one group.
; Reload Presets after editing. Invalid configuration disables application.
[General]
Language=ko
TargetProcess=BlackDesert64.exe
AutoDetectVendor=1
AutoApply=1
MinimizeToTray=1
StartWithWindows=0
SelectedPreset=AMD_Ryzen_Physical
EnableLog=0
; Normal, AboveNormal, High (Realtime is not supported)
ProcessPriority=Normal

[AMD_Ryzen_Physical]
Name=AMD Ryzen - Physical Cores Only
Vendor=AuthenticAMD
Mode=OneThreadPerPhysicalCore

[AMD_Ryzen_All]
Name=AMD Ryzen - All Threads
Vendor=AuthenticAMD
Mode=AllLogicalProcessors

[Intel_PCore_Physical]
Name=Intel - P Cores / Physical Threads
Vendor=GenuineIntel
Mode=PerformanceCoresPhysicalOnly

[Intel_PCore_AllThreads]
Name=Intel - P Cores / SMT Enabled
Vendor=GenuineIntel
Mode=PerformanceCoresOnly

[All_Physical]
Name=Any CPU - Physical Cores Only
Vendor=Any
Mode=OneThreadPerPhysicalCore

[All_Logical]
Name=Any CPU - All Threads
Vendor=Any
Mode=AllLogicalProcessors

[Custom]
Name=Custom CPU List (edit for your CPU)
Vendor=Any
Mode=ExplicitCpuList
CPUs=0,2,4,6,8,10,12,14
